name: Build Studio Voice (debug APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download DPDFNet model (Ceva, Apache-2.0) + verify SHA-256
        run: |
          curl -sfL -o app/src/main/assets/dpdfnet2_48khz_hr.onnx \
            https://huggingface.co/Ceva-IP/DPDFNet/resolve/main/onnx/dpdfnet2_48khz_hr.onnx
          echo "7f0575a5cec0ba4ffd8f8bd657e06d007e4ccdd955d76faab922b9d3291dc14b  app/src/main/assets/dpdfnet2_48khz_hr.onnx" | sha256sum -c -

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --console=plain

      - name: APK info
        run: |
          ls -lh app/build/outputs/apk/debug/
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
          $AAPT dump badging app/build/outputs/apk/debug/app-debug.apk | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-voice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
